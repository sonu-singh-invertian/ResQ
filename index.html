<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResQ - Women Safety System</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #07090e;
            --surface-color: #121824;
            --surface-border: rgba(255, 255, 255, 0.08);
            --accent-red: #ff3b3b;
            --accent-glow: rgba(255, 59, 59, 0.35);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --success-green: #10b981;
            --primary-blue: #3b82f6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 59, 59, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.05) 0%, transparent 40%);
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        /* Header Style */
        .app-header {
            text-align: center;
            margin-bottom: 6px;
        }

        .app-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #fff, var(--text-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .app-header p {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* Glass Cards */
        .glass-card {
            background: var(--surface-color);
            border: 1px solid var(--surface-border);
            border-radius: 20px;
            padding: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        /* SOS Section */
        .sos-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 28px 20px;
            position: relative;
            overflow: hidden;
        }

        .sos-btn {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: linear-gradient(145deg, #ff4d4d, #cc0000);
            border: none;
            color: white;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 0 40px var(--accent-glow), inset 0 2px 5px rgba(255,255,255,0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .sos-btn::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid var(--accent-red);
            animation: pulse-ring 2s infinite;
            opacity: 0;
        }

        @keyframes pulse-ring {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.35); opacity: 0; }
        }

        .sos-btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .sos-hint {
            font-size: 0.78rem;
            color: var(--text-secondary);
            margin-top: 18px;
        }

        /* Status Section */
        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .status-header h3 {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .status-badge {
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 20px;
            background: rgba(16, 185, 129, 0.15);
            color: var(--success-green);
            font-weight: 500;
        }

        .location-box {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 12px;
            border-radius: 12px;
            font-family: monospace;
            font-size: 0.8rem;
            color: var(--success-green);
            word-break: break-all;
        }

        .status-text {
            font-size: 0.82rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        /* Contacts Section */
        .section-title {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }

        input {
            flex: 1;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--surface-border);
            padding: 10px 12px;
            border-radius: 10px;
            color: white;
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary-blue);
        }

        .btn-add {
            background: var(--primary-blue);
            color: white;
            border: none;
            padding: 0 16px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-add:hover {
            background: #2563eb;
        }

        .contact-list {
            list-style: none;
            max-height: 130px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .contact-list::-webkit-scrollbar {
            width: 4px;
        }
        .contact-list::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
        }

        .contact-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 8px 12px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.82rem;
        }

        .contact-info span:first-child {
            font-weight: 500;
            color: var(--text-primary);
            display: block;
        }

        .contact-info span:last-child {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .btn-delete {
            background: none;
            border: none;
            color: #ef4444;
            font-size: 0.78rem;
            font-weight: 500;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .btn-delete:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.82rem;
            padding: 10px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <div class="app-header">
            <h1>ResQ</h1>
            <p>Smart Women Safety & Emergency System</p>
        </div>

        <!-- SOS Panic Card -->
        <div class="glass-card sos-card">
            <button class="sos-btn" onclick="triggerSOS()">SOS</button>
            <p class="sos-hint">Press in emergency to broadcast live location</p>
        </div>

        <!-- Live Status Card -->
        <div class="glass-card">
            <div class="status-header">
                <h3>Live Tracking</h3>
                <span class="status-badge" id="statusBadge">Active</span>
            </div>
            <p class="status-text" id="statusText">Acquiring GPS coordinates...</p>
            <div class="location-box" id="locationCoords">Lat: —, Long: —</div>
        </div>

        <!-- Emergency Contacts Card -->
        <div class="glass-card">
            <h3 class="section-title">Emergency Contacts</h3>
            <div class="input-group">
                <input type="text" id="contactName" placeholder="Name">
                <input type="tel" id="contactPhone" placeholder="Phone Number">
                <button class="btn-add" onclick="addContact()">Add</button>
            </div>
            <ul class="contact-list" id="contactList">
                <!-- Dynamic List -->
            </ul>
        </div>
    </div>

    <script>
        let currentLat = null;
        let currentLong = null;

        window.onload = function() {
            fetchLocation();
            loadContacts();
        };

        function fetchLocation() {
            const statusText = document.getElementById("statusText");
            const locationCoords = document.getElementById("locationCoords");
            const statusBadge = document.getElementById("statusBadge");

            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        currentLat = position.coords.latitude;
                        currentLong = position.coords.longitude;
                        statusText.innerText = "GPS connection secured";
                        statusBadge.innerText = "Ready";
                        locationCoords.innerText = `Lat: ${currentLat.toFixed(5)}, Long: ${currentLong.toFixed(5)}`;
                    },
                    (error) => {
                        statusText.innerText = "Location permission required";
                        statusBadge.innerText = "Error";
                        statusBadge.style.background = "rgba(239, 68, 68, 0.15)";
                        statusBadge.style.color = "#ef4444";
                        locationCoords.innerText = "Unable to fetch coordinates";
                    },
                    { enableHighAccuracy: true }
                );
            } else {
                statusText.innerText = "Geolocation not supported";
            }
        }

        function triggerSOS() {
            const contacts = JSON.parse(localStorage.getItem("emergencyContacts")) || [];
            
            if (contacts.length === 0) {
                alert("Please add at least one emergency contact first.");
                return;
            }

            if (!currentLat || !currentLong) {
                alert("Acquiring location... Please wait a moment.");
                fetchLocation();
                return;
            }

            const mapsLink = `https://www.maps.google.com/?q=${currentLat},${currentLong}`;
            alert(`🚨 ResQ ALERT DISPATCHED! 🚨\n\nEmergency message & Google Maps link sent to ${contacts.length} saved contacts:\n${mapsLink}`);
        }

        function addContact() {
            const nameInput = document.getElementById("contactName");
            const phoneInput = document.getElementById("contactPhone");
            
            const name = nameInput.value.trim();
            const phone = phoneInput.value.trim();

            if (!name || !phone) {
                alert("Please enter both name and phone number.");
                return;
            }

            let contacts = JSON.parse(localStorage.getItem("emergencyContacts")) || [];
            contacts.push({ name, phone });
            localStorage.setItem("emergencyContacts", JSON.stringify(contacts));

            nameInput.value = "";
            phoneInput.value = "";
            loadContacts();
        }

        function loadContacts() {
            const contactList = document.getElementById("contactList");
            contactList.innerHTML = "";

            let contacts = JSON.parse(localStorage.getItem("emergencyContacts")) || [];
            
            if (contacts.length === 0) {
                contactList.innerHTML = `<div class="empty-state">No emergency contacts added yet</div>`;
                return;
            }

            contacts.forEach((contact, index) => {
                const li = document.createElement("li");
                li.className = "contact-item";
                li.innerHTML = `
                    <div class="contact-info">
                        <span>${contact.name}</span>
                        <span>${contact.phone}</span>
                    </div>
                    <button class="btn-delete" onclick="deleteContact(${index})">Remove</button>
                `;
                contactList.appendChild(li);
            });
        }

        function deleteContact(index) {
            let contacts = JSON.parse(localStorage.getItem("emergencyContacts")) || [];
            contacts.splice(index, 1);
            localStorage.setItem("emergencyContacts", JSON.stringify(contacts));
            loadContacts();
        }
    </script>
</body>
</html>
